# Keygen default configuration
# https://github.com/yonasuriv/keygen

# Do not modify this file, as it will be overwritten on next update
# Use the user.conf file instead

# General
TYPE=random				    # Values: random, memorable, uuid, hex, base64, base64url, base32, base58, nanoid, token, secret
CASE=default			    # Values: default, lower, upper, capitalize
ALLOW=letters,numbers		# Values: letters, numbers, symbols, hyphen, space, period, comma, underscore, all
LENGTH=16				    # Range:  8-64

# Other
COUNT=1					    # Number of values to generate
PLAIN=false				    # If true: Print generated values only. Disables colors, boxes, and labels
SPINNER=true				# If false: Disable the progress spinner

# Memorable-mode only:
MEMO_WORDS=4				# Words to generate
MEMO_SEPARATOR=hyphen		# Values: hyphen, space, period, comma, underscore, none
MEMO_CAPITALIZE=true		# Capitalize the first letter of each word
MEMO_NUM_PER_WORD=true		# Number placement: true = after each word, false = once at the end

LOCAL_WORDLIST_PATH=""		# Local cache/fallback. Default: installed/bundled wordlist, then XDG cache
REMOTE_WORDLIST_URL=""		# Source URL for the wordlist to fetch
REMOTE_WORDLIST_MIN_LEN=4	# Minimum word length to fetch from remote wordlists
REMOTE_WORDLIST_TIMEOUT=5	# Download timeout (seconds)